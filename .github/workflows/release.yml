name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9]-*'
      - '[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned to a known-working release — keep in sync with ci.yml/pages.yml.
  EMSDK_VERSION: '4.0.23'

# The engine is an Emscripten-only iOS-PWA target (engine/CMakeLists.txt
# fails the configure step on any other toolchain), so a release is the
# installable PWA bundle — the same artifact Pages deploys. The former
# Linux/Windows/Flatpak jobs built `glhexen2`, which no longer exists.
# See docs/web/ARCHITECTURE.md.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebAssembly client + assemble PWA artifact
        uses: ./.github/actions/wasm-build
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}
          dist-dir: dist

      - name: Validate assembled PWA artifact
        run: ./scripts/wasm-validate-artifact.sh dist

      - name: Package
        run: |
          (cd dist && zip -r ../hexenwail-${{ github.ref_name }}-pwa.zip .)

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-bundle
          path: hexenwail-${{ github.ref_name }}-pwa.zip

      - name: Generate changelog
        run: |
          # Pick the most recently CREATED tag, not the lex-highest version
          # name.  Three legacy tag schemes linger in this repo (uhexen2-*,
          # 26.03-*, v0.7.1-alpha.r3) and lex-sort above the current
          # 0.7.x-beta.rN scheme, so version:refname kept comparing every
          # release against v0.7.1-alpha.r3.
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="## What's changed since $PREV_TAG"
          else
            RANGE="HEAD"
            HEADER="## Initial release"
          fi
          {
            echo "$HEADER"
            echo ""
            echo "### Commits"
            echo ""
            git log "$RANGE" --no-merges --format="- %s (\`%h\`)" | grep -v "Sync beads" || true
            echo ""
            echo "## Downloads"
            echo ""
            echo "- **PWA bundle** — the static site (WebAssembly client + service worker + manifest)."
            echo "  Serve it over HTTPS and install it from Safari via *Share → Add to Home Screen*."
            echo "  The same build is deployed continuously to GitHub Pages."
            echo ""
            echo "Requires game data files (\`pak0.pak\`, \`pak1.pak\`), imported in-app from your own copy of Hexen II."
            echo ""
            echo "**Requirements:** an iOS/iPadOS device running the installed PWA. Other modern browsers may work but are not tested."
          } > release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --prerelease \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes/release_notes.md \
            pwa-bundle/hexenwail-${{ github.ref_name }}-pwa.zip
