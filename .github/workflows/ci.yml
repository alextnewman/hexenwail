name: CI

on:
  push:
    branches: [master]
    tags-ignore:
      - '**'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # Pinned to a known-working release — keep in sync with pages.yml.
  # Never "latest": see the Pages workflow for the rationale.
  EMSDK_VERSION: '4.0.23'

# Least-privilege default: none of these jobs need to write anything back
# to the repo, so restrict GITHUB_TOKEN to read-only.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Nothing here should take more than a few seconds; anything longer is a
    # stall, not work. See the `timeout-minutes` rationale on the pwa job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # shellcheck is preinstalled on the Ubuntu runner images — do not add an
      # `apt-get install` step back here. See .github/actions/wasm-build.
      - name: Shellcheck
        run: |
          shellcheck scripts/mkrelease.sh flatpak/hexenwail.sh \
            scripts/wasm-build.sh scripts/wasm-assemble-artifact.sh \
            scripts/wasm-validate-artifact.sh

  # Dedicated PWA/WebAssembly validation, required on every pull request.
  # Runs the lightweight Node PWA tests, builds the *full* WebAssembly
  # client in both renderer configurations (WebGlideNitro and software
  # rendering with WebGPU presentation),
  # using the same Emscripten setup as the Pages deployment (via the
  # shared .github/actions/wasm-build composite action + scripts/wasm-*.sh),
  # then validates the assembled static artifact — without deploying it.
  # This is what would have caught the host-header contamination
  # (`bits/wordsize.h` not found) before merge.
  #
  # This is the only build job. The engine is an Emscripten-only iOS-PWA
  # target: engine/CMakeLists.txt fails the configure step outright on any
  # other toolchain, so the former nix Linux/Windows `build` job and the
  # opt-in `flatpak` job could no longer do anything but fail. See
  # docs/web/ARCHITECTURE.md for the settled scope.
  pwa:
    name: PWA / WebAssembly
    runs-on: ubuntu-latest
    # A warm-cache run finishes in ~1 minute and a cold emsdk install in a few
    # more, so 30 minutes is generous headroom. The point is the ceiling: with
    # no `timeout-minutes` a job inherits the 360-minute Actions default, and a
    # single stalled network call then occupies a runner for six hours (that is
    # exactly what CI run 41 did). Composite-action steps cannot carry their own
    # `timeout-minutes`, so this job-level bound is what backstops the emsdk
    # download inside .github/actions/wasm-build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebAssembly client + assemble PWA artifact
        uses: ./.github/actions/wasm-build
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}
          dist-dir: dist

      - name: Validate assembled PWA artifact
        run: ./scripts/wasm-validate-artifact.sh dist
