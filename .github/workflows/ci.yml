name: CI

on:
  push:
    branches: [master]
    tags-ignore:
      - '**'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # Pinned to a known-working release — keep in sync with pages.yml.
  # Never "latest": see the Pages workflow for the rationale.
  EMSDK_VERSION: '4.0.23'

# Least-privilege default: none of these jobs need to write anything back
# to the repo, so restrict GITHUB_TOKEN to read-only.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          shellcheck scripts/mkrelease.sh flatpak/hexenwail.sh \
            scripts/wasm-build.sh scripts/wasm-assemble-artifact.sh \
            scripts/wasm-validate-artifact.sh scripts/webgl-smoke-test.sh

  # Dedicated PWA/WebAssembly validation, required on every pull request.
  # Runs the lightweight Node PWA tests, builds the *full* WebAssembly
  # client with the same Emscripten configuration as the Pages deployment
  # (via the shared .github/actions/wasm-build composite action + scripts/
  # wasm-*.sh), and validates the assembled static artifact — without
  # deploying it. This is what would have caught the host-header
  # contamination (`bits/wordsize.h` not found) before merge.
  pwa:
    name: PWA / WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebAssembly client + assemble PWA artifact
        uses: ./.github/actions/wasm-build
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}
          dist-dir: dist

      - name: Validate assembled PWA artifact
        run: ./scripts/wasm-validate-artifact.sh dist

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        # Cachix outages (e.g. 502 from cachix.org) shouldn't fail the build —
        # we just lose the cache for that run.
        continue-on-error: true
        with:
          name: hexenwail
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Linux
        run: nix build .#nixos --print-build-logs

      - name: Smoke test
        run: SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy timeout 10 nix run .#nixos -- -help 2>&1 | head -20 || true

      - name: Build Windows
        run: nix build .#win64 --print-build-logs

  flatpak:
    # The Flatpak build is slow and unrelated to routine PWA/native PR
    # validation (it doesn't catch WebAssembly regressions and previously
    # ran on every PR just adding minutes without signal for this goal).
    # Tagged releases already build+publish it via release.yml; here it's
    # opt-in only: manual "Run workflow", or a PR explicitly labeled
    # "flatpak" for when a change actually touches the Flatpak manifest.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'flatpak')
    runs-on: ubuntu-latest
    # flatpak + flatpak-builder are installed directly on the runner — the
    # bilelmoussaoui/flatpak-github-actions container image worked until
    # Docker Hub flaked (release run 27069188929, 2026-06-06) and tanked
    # the whole release because the container couldn't be pulled.  Ubuntu
    # 24.04 ships flatpak-builder in main, so no PPA is needed.  The 25.08
    # runtime/SDK is still pulled from Flathub either way.
    steps:
      - uses: actions/checkout@v6
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # The container image came with Flathub pre-configured and ran as
          # root; a bare apt install on the runner has neither.  Add the
          # system remote, then pre-install the runtime + SDK as root (root
          # bypasses polkit, which the unprivileged runner user lacks for
          # system flatpak operations).  Without this the action's own
          # `flatpak --system install` fails with "operation Deploy not
          # allowed for user"; once the deps are present that install is a
          # no-op.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hexenwail.flatpak
          manifest-path: flatpak/io.github.hexenwail.hexenwail.yml
          cache-key: flatpak-builder-${{ github.sha }}
