name: Pages PWA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned to a known-working release (SDL3 support via -sUSE_SDL=3 landed
  # in 3.1.73; 4.0.23 is a later, well-exercised release on the same
  # numbering scheme). Never "latest" — keep in sync with ci.yml.
  EMSDK_VERSION: '4.0.23'

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebAssembly client + assemble PWA artifact
        uses: ./.github/actions/wasm-build
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}
          dist-dir: dist

      - name: Validate assembled Pages artifact
        run: ./scripts/wasm-validate-artifact.sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Repository Settings → Pages → Source must be set to “GitHub Actions”.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
