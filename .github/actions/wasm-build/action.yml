name: 'Build hexenwail WebAssembly + PWA artifact'
description: >-
  Installs a pinned Emscripten SDK (with caching), prefetches the ogg/vorbis
  ports, runs the lightweight Node PWA tests, builds the supported WebAssembly
  client configurations (software and WebGlideNitro), and assembles the static
  Pages/PWA artifact. Single source of truth shared by the PR "PWA /
  WebAssembly" check and the GitHub Pages deployment workflow so the two build
  recipes cannot drift apart.

inputs:
  emsdk-version:
    description: 'Pinned emsdk/Emscripten version to install (never "latest").'
    required: true
  dist-dir:
    description: 'Directory to assemble the static PWA artifact into.'
    required: false
    default: 'dist'

outputs:
  dist-dir:
    description: 'Directory containing the assembled PWA artifact.'
    value: ${{ inputs.dist-dir }}

runs:
  using: 'composite'
  steps:
    # DO NOT reintroduce `apt-get` here. This step used to run
    # `apt-get update && apt-get install build-essential cmake pkg-config
    # python3`, which bought this build precisely nothing:
    #
    #   * pkg-config and python3 were reported "already the newest version";
    #   * build-essential is a metapackage whose contents (gcc, make, libc6-dev)
    #     were already on the image — only the metapackage itself was "new";
    #   * apt's cmake (3.28.3, /usr/bin) was then shadowed on PATH by the
    #     image's own newer cmake (3.31.6, /usr/local/bin), which is the one
    #     emcmake actually invoked.
    #
    # Meanwhile it cost ~90s on every run and was by far the biggest hang risk
    # in the pipeline: `apt-get update` wedged on `archive.ubuntu.com
    # noble-security InRelease` for the full 360-minute job default in CI run
    # 41, and again for 22 minutes across four attempts of Pages run 12.
    #
    # A native toolchain was never really a dependency anyway — the Emscripten
    # toolchain file makes emcc the compiler, so CMake never probes for a host
    # one (see engine/CMakeLists.txt, which hard-errors off Emscripten).
    #
    # Verify instead of install: should a future runner image ever drop one of
    # these, this fails in seconds with an obvious message rather than deep
    # inside the CMake configure or build step.
    - name: Verify build toolchain
      shell: bash
      run: |
        set -eu
        missing=
        for tool in cmake make python3 git; do
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "::error::Runner image is missing required tools:$missing"
          exit 1
        fi
        cmake --version
        python3 --version

    - name: Run lightweight PWA tests
      shell: bash
      run: node --test web/test/*.test.js

    - name: Run headless WebGL2 renderer smoke test
      shell: bash
      run: ./scripts/webgl-smoke-test.sh

    - name: Cache emsdk
      id: cache-emsdk
      uses: actions/cache@v4
      with:
        path: emsdk
        key: emsdk-${{ runner.os }}-${{ inputs.emsdk-version }}

    # Emscripten's cache holds both the compiled sysroot libraries and any
    # built ports. By default it lives *inside* the emsdk checkout, which
    # would make it a hostage of the emsdk cache above: that key never
    # changes, so once it is warm actions/cache stops saving it and every
    # later run would refetch the ports over the network. Pin the cache to
    # its own path with its own key instead.
    - name: Pin Emscripten cache location
      shell: bash
      run: echo "EM_CACHE=$HOME/.emscripten_cache" >> "$GITHUB_ENV"

    - name: Cache Emscripten sysroot + ports
      uses: actions/cache@v4
      with:
        path: ~/.emscripten_cache
        # engine/CMakeLists.txt is what decides which ports this build needs
        # (see USE_CODEC_VORBIS), so changing it earns a fresh cache entry --
        # while the restore-keys prefix still seeds it from the previous one
        # so a port set that did not change is not refetched.
        key: emcache-${{ runner.os }}-${{ inputs.emsdk-version }}-${{ hashFiles('engine/CMakeLists.txt') }}
        restore-keys: |
          emcache-${{ runner.os }}-${{ inputs.emsdk-version }}-

    - name: Install emsdk
      shell: bash
      run: |
        if [ ! -d emsdk/.git ]; then
          rm -rf emsdk
          git clone https://github.com/emscripten-core/emsdk.git emsdk
        fi
        cd emsdk
        ./emsdk install "${{ inputs.emsdk-version }}"
        ./emsdk activate "${{ inputs.emsdk-version }}"

    # Ogg Vorbis music decoding uses the Emscripten ogg/vorbis ports, which
    # emcc downloads from github.com the first time they are built. Do that
    # here, as its own step, rather than letting it happen implicitly in the
    # middle of the compile: a port fetch is the one network call left in the
    # build, and this way a failure names itself instead of surfacing as a
    # mystery "vorbis/vorbisfile.h: No such file or directory". With the
    # cache above warm this is a no-op.
    - name: Prefetch Emscripten ogg/vorbis ports
      shell: bash
      run: |
        source "$PWD/emsdk/emsdk_env.sh"
        embuilder build ogg vorbis

    - name: Build WebAssembly client (parked software reference)
      shell: bash
      run: |
        source "$PWD/emsdk/emsdk_env.sh"
        ./scripts/wasm-build.sh software

    # The WebGL2 renderer used to be a compile-only regression guard whose
    # output was thrown away. It now ships alongside the software bundle
    # as the launcher's opt-in "WebGlide" experimental GPU renderer, an
    # experimental pipeline inspired by mid-90s 3Dfx Glide hardware (see
    # docs/PWA.md and web/app.js). engine/CMakeLists.txt names the
    # artefacts hexenwail-webglide.* under -DWEB_RENDERER=webgl2 -- the
    # CMake option value is still "webgl2" but the shipped bundle basename
    # and the user-facing renderer name are WebGlide. The two bundles
    # land side by side so the Emscripten .js still finds its own .wasm
    # sibling by basename.
    - name: Build WebAssembly client (webgl2 renderer, WebGlide GPU bundle)
      shell: bash
      run: |
        source "$PWD/emsdk/emsdk_env.sh"
        ./scripts/wasm-build.sh webgl2 engine/build-webgl2

    # Target-feasibility bundle: the unchanged software rasterizer presented
    # through WebGPU. This is deliberately not the gated WebGlideNitro renderer.
    - name: Build WebAssembly client (WebGPU presenter preview)
      shell: bash
      run: |
        source "$PWD/emsdk/emsdk_env.sh"
        ./scripts/wasm-build.sh webgpu engine/build-webgpu

    # WebGlideNitro: a native WebGPU renderer that pushes real engine
    # geometry rather than scanning out the software framebuffer. Its first
    # slice draws the static world only; see docs/web/WEBGLIDE_NITRO.md.
    - name: Build WebAssembly client (WebGlideNitro native WebGPU renderer)
      shell: bash
      run: |
        source "$PWD/emsdk/emsdk_env.sh"
        ./scripts/wasm-build.sh nitro engine/build-nitro

    - name: Assemble PWA artifact
      shell: bash
      run: ./scripts/wasm-assemble-artifact.sh "${{ inputs.dist-dir }}"

    # CI builds both renderer configurations, so the assembled artefact
    # must contain both bundles. wasm-validate-artifact.sh keeps the
    # WebGlide bundle informational so a local `make dist` from a fresh
    # clone still succeeds with software-only output; this step is where
    # the "CI ships both" contract is enforced. A missing pair here means
    # the assemble step failed to pick up the webgl2 build even though
    # we just ran it.
    - name: Verify shipped WebGlide GPU bundle
      shell: bash
      run: |
        set -eu
        dist="${{ inputs.dist-dir }}"
        for required in hexenwail-webglide.js hexenwail-webglide.wasm; do
          if [ ! -s "$dist/$required" ]; then
            echo "::error::CI artefact is missing the WebGlide GPU bundle: $dist/$required"
            exit 1
          fi
        done
        echo "WebGlide GPU bundle present in $dist."

        for required in hexenwail-webgpu.js hexenwail-webgpu.wasm; do
          if [ ! -s "$dist/$required" ]; then
            echo "::error::CI artefact is missing the WebGPU presenter preview: $dist/$required"
            exit 1
          fi
        done
        echo "WebGPU presenter preview present in $dist."

        for required in hexenwail-nitro.js hexenwail-nitro.wasm; do
          if [ ! -s "$dist/$required" ]; then
            echo "::error::CI artefact is missing the WebGlideNitro bundle: $dist/$required"
            exit 1
          fi
        done
        echo "WebGlideNitro bundle present in $dist."
